<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คืนนี้... กล้าเปิดไหม? 🍷🖤</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(circle at top, #2b0916 0%, #12040a 60%, #070204 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #f3d8e0;
            padding: 20px;
        }

        /* ประกายไฟและสัญลักษณ์ลึกลับลอยพื้นหลัง */
        .heart-bg {
            position: fixed;
            color: rgba(255, 42, 95, 0.22);
            animation: floatUp linear infinite;
            user-select: none;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255, 42, 95, 0.4));
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(25deg); opacity: 0; }
        }

        /* กรอบแอปหลักสไตล์ Dark Velvet */
        .app-container {
            background: rgba(24, 9, 16, 0.85);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 51, 102, 0.35);
            border-radius: 32px;
            padding: 30px 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(255, 30, 86, 0.12);
            z-index: 1;
            position: relative;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji-big {
            font-size: 3rem;
            margin-bottom: 6px;
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(255, 51, 102, 0.6));
            animation: pulseGlow 2.5s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.5)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.9)); }
        }

        h2 {
            font-family: 'Mali', cursive;
            color: #ff4d79;
            font-size: 1.45rem;
            margin-bottom: 8px;
            line-height: 1.35;
            text-shadow: 0 0 12px rgba(255, 77, 121, 0.4);
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #c9a6b1;
            margin-bottom: 14px;
        }
        p strong {
            color: #ff7597;
        }

        .pick-counter {
            display: inline-block;
            background: rgba(255, 42, 95, 0.15);
            color: #ff7597;
            border: 1px solid rgba(255, 77, 121, 0.5);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
            box-shadow: 0 0 12px rgba(255, 42, 95, 0.2);
            transition: all 0.3s ease;
        }

        /* ตารางแผ่นป้าย 10 ใบ สไตล์ไพ่ทาโรต์/ความลับ */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
            margin: 8px 0;
        }
        .mystery-card {
            background: linear-gradient(145deg, #2a0c18 0%, #14050b 100%);
            color: #ff8fa8;
            border-radius: 18px;
            padding: 15px 8px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            min-height: 102px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255, 77, 121, 0.35);
        }
        .mystery-card:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #ff4d79;
            background: linear-gradient(145deg, #3d1123 0%, #1d0710 100%);
            box-shadow: 0 8px 22px rgba(255, 42, 95, 0.35);
        }
        .mystery-card:active {
            transform: scale(0.96);
        }
        .mystery-card .card-front-icon {
            font-size: 1.65rem;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 6px rgba(255, 77, 121, 0.4));
        }
        .mystery-card .card-front-text {
            font-family: 'Mali', cursive;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ป้ายที่ถูกเลือก (2 ใบ) - เปล่งแสงสีแดงไวน์ */
        .mystery-card.revealed {
            background: linear-gradient(135deg, #590d22 0%, #2b0610 100%);
            color: #ffffff;
            border: 2px solid #ff4d79;
            box-shadow: 0 0 22px rgba(255, 77, 121, 0.55);
            transform: scale(1.03);
            cursor: default;
            pointer-events: none;
            animation: popCard 0.4s ease;
            z-index: 2;
        }
        .picked-tag {
            background: linear-gradient(45deg, #ff2a5f, #ff5c8a);
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 10px;
            margin-bottom: 5px;
            box-shadow: 0 2px 8px rgba(255, 42, 95, 0.5);
        }

        /* ป้ายที่เหลืออีก 8 ใบที่พลิกเฉลยตามหลัง */
        .mystery-card.missed {
            background: rgba(18, 8, 12, 0.7);
            color: #7a5c66;
            border: 1px dashed rgba(255, 77, 121, 0.2);
            box-shadow: none;
            opacity: 0.65;
            transform: scale(0.96);
            cursor: default;
            pointer-events: none;
            animation: flipReveal 0.45s ease;
        }
        @keyframes popCard {
            0% { transform: scale(0.85); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1.03); }
        }
        @keyframes flipReveal {
            0% { transform: rotateY(90deg) scale(0.92); opacity: 0.2; }
            100% { transform: rotateY(0deg) scale(0.96); opacity: 0.65; }
        }

        /* กล่องสรุปผล */
        .prize-result-box {
            display: none;
            background: rgba(38, 12, 23, 0.9);
            border: 1px solid rgba(255, 77, 121, 0.5);
            border-radius: 18px;
            padding: 16px 14px;
            margin-top: 16px;
            color: #ffd6e0;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.55;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease forwards;
            text-align: left;
        }
        .result-item {
            background: rgba(18, 5, 11, 0.85);
            border-radius: 12px;
            padding: 11px 13px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 77, 121, 0.28);
        }
        .result-item:last-child {
            margin-bottom: 0;
        }

        /* ปุ่มกด */
        .btn-group {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background: linear-gradient(45deg, #c9184a, #ff4d79);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 42, 95, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(255, 42, 95, 0.6);
        }
        .btn-back-home {
            background: none;
            border: none;
            color: #a67b88;
            font-family: 'Prompt', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 4px;
            transition: color 0.2s;
        }
        .btn-back-home:hover {
            color: #ff7597;
        }

        /* พลุอิโมจิตอนเปิดครบ */
        .burst-heart {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 99;
            filter: drop-shadow(0 0 8px rgba(255, 42, 95, 0.7));
            animation: burstUp 1.5s ease-out forwards;
        }
        @keyframes burstUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="emoji-big">🍷</div>
        <h2>คืนนี้... กล้าเปิดไหม? 😈</h2>
        <p>หลังป้ายพวกนี้มีความลับซ่อนอยู่...<br>เลือกเปิดได้แค่ <strong>2 ป้ายเท่านั้น</strong> ห้ามเปลี่ยนใจนะ 🤫</p>
        
        <div class="pick-counter" id="pick-counter">เลือกความลับได้อีก: 2 ป้าย</div>

        <div class="cards-grid" id="mystery-grid"></div>

        <div class="prize-result-box" id="prize-result"></div>

        <div class="btn-group">
            <button class="btn" id="reset-btn" style="display: none;" onclick="initGame()">วัดใจอีกรอบ 🔮</button>
            <a href="index.html" class="btn-back-home">← กลับหน้าหลัก</a>
        </div>
    </div>

    <script>
        // สร้างสัญลักษณ์ลึกลับลอยพื้นหลัง
        function createHearts() {
            const hearts = ['🍷', '🔥', '💋', '🖤', '✨', '😈'];
            for (let i = 0; i < 16; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 15 + 13) + 'px';
                heart.style.animationDuration = (Math.random() * 7 + 7) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(heart);
            }
        }
        createHearts();

        // รายการความลับ 10 ป้าย
        const prizes = [
            { icon: '🙈', title: 'ปิดตาห้ามแอบดู', desc: 'ปิดตาไว้เฉย ๆ เดี๋ยวเค้าจัดการเองทั้งหมด 💋' },
            { icon: '🔥', title: 'คืนนี้เบบี๋คุมเกม', desc: 'ตามใจเบบี๋ทุกอย่าง เค้ายอมหมดเลย 🙈' },
            { icon: '💦', title: 'อ๊อกให้เบบี๋ 1 ที', desc: 'งั่มมม จัดให้ตามคำขอเลยค้าบบ 😈' },
            { icon: '💋', title: 'จุ้บซอกคอ 10 ที', desc: 'ห้ามดิ้น ห้ามหนี ให้อยู่นิ่ง ๆ ให้จุ้บจนกว่าจะครบ 😘' },
            { icon: '💆‍♂️', title: 'นวดผ่อนคลายให้เค้า', desc: 'นวดให้ก่อน เดี๋ยวมีรางวัลตอบแทนชุดใหญ่ 😜' },
            { icon: '🫦', title: 'ถอดออก 1 ชิ้นเดี๋ยวนี้!', desc: 'ไม่ว่าจะใส่อะไรอยู่ ถอดออก 1 ชิ้นทันที ห้ามโกง 🔥' },
            { icon: '😈', title: 'เงี่ยนก็จัดเล้ยยย', desc: 'ไม่ต้องรอฤกษ์งามยามดี เริ่มเลยละกัน 💥' },
            { icon: '🤫', title: 'ห้ามส่งเสียงดัง!', desc: 'คืนนี้ต้องเล่นแบบเงียบ ๆ ห้ามหลุดเสียงออกมาเด็ดขาด 🙈' },
            { icon: '😝', title: 'ว้ายยย อดแจ๊ะ!', desc: 'ดวงไม่มีเลยน้าาา รอบนี้อดไปก่อนนะจ๊ะ 😜' },
            { icon: '😴', title: 'ห่มผ้านอนกอดเฉยๆ', desc: 'คืนนี้เป็นเด็กดี นอนกอดกันเฉยๆ ห้ามซน 🛌' }
        ];

        const maxPicks = 2;
        let pickedCards = [];
        let shuffledPrizes = [];

        function initGame() {
            pickedCards = [];
            shuffledPrizes = [...prizes].sort(() => Math.random() - 0.5);

            const mysteryGrid = document.getElementById('mystery-grid');
            mysteryGrid.innerHTML = '';

            const counterEl = document.getElementById('pick-counter');
            counterEl.innerText = `เลือกความลับได้อีก: ${maxPicks} ป้าย`;
            counterEl.style.background = 'rgba(255, 42, 95, 0.15)';
            counterEl.style.color = '#ff7597';

            document.getElementById('prize-result').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'none';

            shuffledPrizes.forEach((prize, index) => {
                const card = document.createElement('div');
                card.className = 'mystery-card';
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-front-icon">🗝️</div>
                    <div class="card-front-text">ความลับที่ ${index + 1}</div>
                `;
                card.onclick = () => revealPrize(card, prize);
                mysteryGrid.appendChild(card);
            });
        }

        function revealPrize(selectedCard, prize) {
            if (pickedCards.length >= maxPicks || selectedCard.classList.contains('revealed')) return;
            
            pickedCards.push({ card: selectedCard, prize: prize });
            const remaining = maxPicks - pickedCards.length;

            // เปิดใบที่เลือก
            selectedCard.classList.add('revealed');
            selectedCard.innerHTML = `
                <span class="picked-tag">เลือกใบที่ ${pickedCards.length} 🔥</span>
                <div style="font-size: 1.6rem; margin-bottom: 3px;">${prize.icon}</div>
                <div style="font-family: 'Mali', cursive; font-weight: 700; font-size: 0.84rem; line-height: 1.25;">${prize.title}</div>
            `;

            const counterEl = document.getElementById('pick-counter');
            if (remaining > 0) {
                counterEl.innerText = `เลือกความลับได้อีก ${remaining} ป้าย ลุ้นๆ 👀`;
            } else {
                counterEl.innerText = `เปิดครบ 2 ป้ายแล้ว! มาดูเฉลยที่ซ่อนอยู่ 😈`;
                counterEl.style.background = 'linear-gradient(45deg, #c9184a, #ff4d79)';
                counterEl.style.color = '#ffffff';
                burstHearts(18);

                // พลิกเฉลยอีก 8 ใบที่เหลือทั้งหมด
                setTimeout(() => {
                    document.querySelectorAll('.mystery-card').forEach(c => {
                        if (!c.classList.contains('revealed')) {
                            const idx = c.dataset.index;
                            const otherPrize = shuffledPrizes[idx];
                            c.classList.add('missed');
                            c.innerHTML = `
                                <div style="font-size: 1.35rem; margin-bottom: 2px; opacity: 0.75;">${otherPrize.icon}</div>
                                <div style="font-family: 'Mali', cursive; font-weight: 600; font-size: 0.74rem; line-height: 1.2;">${otherPrize.title}</div>
                            `;
                        }
                    });
                }, 450);

                // แสดงสรุปรางวัลทั้ง 2 อย่างด้านล่าง
                const resultBox = document.getElementById('prize-result');
                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    <div style="text-align: center; font-size: 1rem; margin-bottom: 10px; color: #ff7597;">🔮 <strong>คำสั่งลับคืนนี้ของเบบี๋:</strong></div>
                    <div class="result-item">
                        <div style="color: #ff8fa8;">1️⃣ <strong>${pickedCards[0].prize.title}</strong></div>
                        <div style="font-weight: 400; font-size: 0.83rem; color: #d4b2bc; margin-top: 3px;">${pickedCards[0].prize.desc}</div>
                    </div>
                    <div class="result-item">
                        <div style="color: #ff8fa8;">2️⃣ <strong>${pickedCards[1].prize.title}</strong></div>
                        <div style="font-weight: 400; font-size: 0.83rem; color: #d4b2bc; margin-top: 3px;">${pickedCards[1].prize.desc}</div>
                    </div>
                `;

                document.getElementById('reset-btn').style.display = 'inline-block';
            }
        }

        function burstHearts(count) {
            const emojis = ['🔥', '💋', '😈', '🍷', '🖤'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'burst-heart';
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (Math.random() * 80 + 10) + 'vw';
                    el.style.top = (Math.random() * 40 + 45) + 'vh';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 1500);
                }, i * 60);
            }
        }

        initGame();
    </script>
</body>
</html>
