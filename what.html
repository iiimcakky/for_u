<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงล้อเสี่ยงทาย 2 ชั้น 💕🎡</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #4a4a4a;
            padding: 20px;
        }

        /* หัวใจลอยพื้นหลัง */
        .heart-bg {
            position: fixed;
            color: rgba(255, 117, 143, 0.25);
            animation: floatUp linear infinite;
            user-select: none;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* กรอบแอปหลัก */
        .app-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 32px;
            padding: 24px 18px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(255, 117, 143, 0.2);
            z-index: 1;
            position: relative;
        }

        h2 {
            font-family: 'Mali', cursive;
            color: #ff4d6d;
            font-size: 1.45rem;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 16px;
        }

        /* ส่วนของวงล้อ */
        .wheels-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }

        .wheel-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-label {
            font-family: 'Mali', cursive;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .label-action {
            background: #ffe0e6;
            color: #ff4d6d;
        }
        .label-target {
            background: #ede9fe;
            color: #7c3aed;
        }

        .canvas-container {
            position: relative;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            border: 5px solid #ffffff;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        /* เข็มชี้ด้านบนของวงล้อ */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #ff4d6d;
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .pointer-purple {
            border-top-color: #7c3aed;
        }

        /* จุดกลางวงล้อ */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34px;
            height: 34px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 4;
        }

        /* กล่องแสดงผลลัพธ์ */
        .result-card {
            display: none;
            background: linear-gradient(135deg, #fff0f3 0%, #f5f3ff 100%);
            border: 2px dashed #ff758f;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            animation: popIn 0.4s ease forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-title {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
        }
        .result-combo {
            font-family: 'Mali', cursive;
            font-size: 1.25rem;
            font-weight: 700;
            color: #d90429;
            line-height: 1.4;
        }
        .result-combo span {
            color: #7c3aed;
        }

        /* ปุ่มกด */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .btn-main {
            background: linear-gradient(45deg, #ff4d6d, #9d4edd);
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 50px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 77, 109, 0.3);
            transition: all 0.2s;
            width: 100%;
            max-width: 280px;
        }
        .btn-main:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 77, 109, 0.4);
        }
        .btn-main:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .sub-btns {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 280px;
        }
        .btn-sub {
            flex: 1;
            background: #ffffff;
            color: #ff4d6d;
            border: 1.5px solid #ffb3c1;
            padding: 8px 10px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sub:hover:not(:disabled) {
            background: #fff0f3;
        }
        .btn-sub.purple {
            color: #7c3aed;
            border-color: #ddd6fe;
        }
        .btn-sub.purple:hover:not(:disabled) {
            background: #f5f3ff;
        }
        .btn-sub:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-edit {
            background: none;
            border: none;
            color: #888;
            font-family: 'Prompt', sans-serif;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-edit:hover { color: #ff4d6d; }

        /* หน้าต่างแก้ไขข้อความ (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-content h3 {
            font-family: 'Mali', cursive;
            color: #ff4d6d;
            margin-bottom: 10px;
            text-align: center;
        }
        .edit-group {
            margin-bottom: 12px;
        }
        .edit-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4a4a4a;
        }
        textarea {
            width: 100%;
            height: 110px;
            border: 1.5px solid #ffb3c1;
            border-radius: 12px;
            padding: 8px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.85rem;
            resize: none;
        }

        /* พลุหัวใจ */
        .burst-heart {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 99;
            animation: burstUp 1.5s ease-out forwards;
        }
        @keyframes burstUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>วงล้อเสี่ยงทาย 2 ชั้น 🎡💕</h2>
        <p class="subtitle">หมุนผสมคอมโบสุดเสียว... <strong>การกระทำ + ตำแหน่ง/เงื่อนไข</strong></p>

        <div class="wheels-wrapper">
            <!-- วงล้อที่ 1: การกระทำ -->
            <div class="wheel-box">
                <div class="wheel-label label-action">1️⃣ ทำอะไรดีน้าา?</div>
                <div class="canvas-container">
                    <div class="pointer"></div>
                    <canvas id="wheel1" width="300" height="300"></canvas>
                    <div class="center-dot">💋</div>
                </div>
            </div>

            <!-- วงล้อที่ 2: ตำแหน่ง / เงื่อนไข -->
            <div class="wheel-box">
                <div class="wheel-label label-target">2️⃣ ตรงไหน / เงื่อนไขอะไร?</div>
                <div class="canvas-container">
                    <div class="pointer pointer-purple"></div>
                    <canvas id="wheel2" width="300" height="300"></canvas>
                    <div class="center-dot">🔥</div>
                </div>
            </div>
        </div>

        <!-- กล่องสรุปผล -->
        <div class="result-card" id="result-card">
            <div class="result-title">🎉 คอมโบที่เบบี๋สุ่มได้คือ...</div>
            <div class="result-combo" id="result-text"></div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="btn-group">
            <button class="btn-main" id="spin-both-btn" onclick="spinBoth()">หมุนพร้อมกันเลย! 🎰</button>
            <div class="sub-btns">
                <button class="btn-sub" id="spin1-btn" onclick="spinSingle(1)">หมุนวงล้อ 1</button>
                <button class="btn-sub purple" id="spin2-btn" onclick="spinSingle(2)">หมุนวงล้อ 2</button>
            </div>
            <!-- <button class="btn-edit" onclick="openModal()">⚙️ แก้ไขข้อความในวงล้อเอง</button> -->
        </div>
    </div>

    <!-- Modal แก้ไขข้อความ -->

    <script>
        // หัวใจลอยพื้นหลัง
        function createHearts() {
            const hearts = ['❤️', '💖', '💕', '💜', '✨', '🔥'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
                heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(heart);
            }
        }
        createHearts();

        // ข้อมูลเริ่มต้นของทั้ง 2 วงล้อ
        let actionsList = [
            "จุ้บเบาๆ 10 ที",
            "ดูดเบาๆ 💋",
            "ลูบไล้ช้าๆ",
            "แลกลิ้น 30 วิ",
            "เป่าลมร้อนๆ",
            "ตีก้นเบาๆ 5 ที",
            "อ๊อกให้ 1 ที",
            "นวดผ่อนคลาย"
        ];

        let targetsList = [
            "ที่ซอกคอ 💋",
            "ที่ใบหู 👂",
            "แบบปิดตา 🙈",
            "ห้ามใช้มือ! 🚫",
            "ที่ต้นขาด้านใน 🔥",
            "ห้ามส่งเสียงดัง 🤫",
            "ในท่าใหม่ 🫣",
            "ถอดอะไรก็ได้ 1 ชิ้น 😝"
        ];

        const colors1 = ['#ff4d6d', '#ff8fa3', '#ff758f', '#ffb3c1'];
        const colors2 = ['#7c3aed', '#a78bfa', '#8b5cf6', '#c4b5fd'];

        let currentDeg1 = 0;
        let currentDeg2 = 0;
        let isSpinning1 = false;
        let isSpinning2 = false;
        let selectedAction = "";
        let selectedTarget = "";

        // ฟังก์ชันวาดวงล้อลง Canvas
        function drawWheel(canvasId, items, palette) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const numOptions = items.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numOptions; i++) {
                const angle = i * arcSize - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.closePath();

                ctx.fillStyle = palette[i % palette.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // วาดข้อความ
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = (i % palette.length === 3) ? '#4a4a4a' : '#ffffff';
                ctx.font = 'bold 14px Prompt, sans-serif';
                ctx.fillText(items[i], radius - 16, 5);
                ctx.restore();
            }
        }

        function initWheels() {
            drawWheel('wheel1', actionsList, colors1);
            drawWheel('wheel2', targetsList, colors2);
        }

        function getResultFromDeg(deg, items) {
            const actualDeg = deg % 360;
            const sliceAngle = 360 / items.length;
            const index = Math.floor(((360 - actualDeg) % 360) / sliceAngle);
            return items[index];
        }

        function updateButtonsState() {
            const busy = isSpinning1 || isSpinning2;
            document.getElementById('spin-both-btn').disabled = busy;
            document.getElementById('spin1-btn').disabled = isSpinning1;
            document.getElementById('spin2-btn').disabled = isSpinning2;
        }

        function spinSingle(wheelNum) {
            document.getElementById('result-card').style.display = 'none';
            const extraSpins = Math.floor(Math.random() * 5 + 5) * 360;
            const randomStop = Math.floor(Math.random() * 360);

            if (wheelNum === 1 && !isSpinning1) {
                isSpinning1 = true;
                updateButtonsState();
                currentDeg1 += extraSpins + randomStop;
                const canvas1 = document.getElementById('wheel1');
                canvas1.style.transform = `rotate(${currentDeg1}deg)`;

                setTimeout(() => {
                    isSpinning1 = false;
                    selectedAction = getResultFromDeg(currentDeg1, actionsList);
                    updateButtonsState();
                    checkAndShowResult();
                }, 4000);
            } 
            else if (wheelNum === 2 && !isSpinning2) {
                isSpinning2 = true;
                updateButtonsState();
                currentDeg2 += extraSpins + randomStop;
                const canvas2 = document.getElementById('wheel2');
                canvas2.style.transform = `rotate(${currentDeg2}deg)`;

                setTimeout(() => {
                    isSpinning2 = false;
                    selectedTarget = getResultFromDeg(currentDeg2, targetsList);
                    updateButtonsState();
                    checkAndShowResult();
                }, 4000);
            }
        }

        function spinBoth() {
            spinSingle(1);
            spinSingle(2);
        }

        function checkAndShowResult() {
            if (!isSpinning1 && !isSpinning2 && selectedAction && selectedTarget) {
                const resCard = document.getElementById('result-card');
                const resText = document.getElementById('result-text');
                resText.innerHTML = `"${selectedAction}" <br><span>+ ${selectedTarget}</span>`;
                resCard.style.display = 'block';
                burstHearts(15);
            }
        }

        function openModal() {
            document.getElementById('edit-actions').value = actionsList.join('\n');
            document.getElementById('edit-targets').value = targetsList.join('\n');
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function saveEdits() {
            const newActions = document.getElementById('edit-actions').value.split('\n').map(s => s.trim()).filter(s => s !== '');
            const newTargets = document.getElementById('edit-targets').value.split('\n').map(s => s.trim()).filter(s => s !== '');

            if (newActions.length < 2 || newTargets.length < 2) {
                alert('กรุณาใส่อย่างน้อยวงล้อละ 2 ข้อนะครับ!');
                return;
            }

            actionsList = newActions;
            targetsList = newTargets;
            selectedAction = "";
            selectedTarget = "";
            document.getElementById('result-card').style.display = 'none';
            initWheels();
            closeModal();
        }

        function burstHearts(count) {
            const emojis = ['❤️', '💖', '🔥', '💕', '😘', '💜'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'burst-heart';
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (Math.random() * 80 + 10) + 'vw';
                    el.style.top = (Math.random() * 40 + 45) + 'vh';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 1500);
                }, i * 60);
            }
        }

        initWheels();
    </script>
</body>
