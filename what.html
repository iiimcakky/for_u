<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บอร์ดเกมทอยเต๋าของเบบี๋ 20+ 💕🎲</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            padding: 15px;
            overflow-x: hidden;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.96);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 20px 15px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(255, 117, 143, 0.22);
            position: relative;
        }

        h2 {
            font-family: 'Mali', cursive;
            color: #ff4d6d;
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .badges-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #fff0f3;
            border: 1.5px solid #ff8fa3;
            color: #ff4d6d;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 5px 16px;
            border-radius: 20px;
        }

        /* กระดานเกม 4x5 = 20 ช่อง */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .cell {
            background: #ffffff;
            border: 2px solid #ffe0e6;
            border-radius: 14px;
            padding: 8px 4px;
            min-height: 78px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            font-size: 0.72rem;
            box-shadow: 0 3px 6px rgba(255, 117, 143, 0.08);
            transition: all 0.2s;
        }

        .cell.active-cell {
            transform: scale(1.04);
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
            z-index: 2;
        }

        .cell-num {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 0.62rem;
            font-weight: 700;
            color: #aaa;
        }

        .cell-icon {
            font-size: 1.35rem;
            margin-top: 8px;
        }

        .cell-title {
            font-family: 'Mali', cursive;
            font-weight: 700;
            line-height: 1.15;
            color: #4a4a4a;
        }

        /* สีแยกประเภทช่อง */
        .cell.type-cute { background: #fff8f9; border-color: #ffb3c1; }
        .cell.type-hot { background: #fff0f3; border-color: #ff4d6d; }
        .cell.type-hot .cell-title { color: #d90429; }
        .cell.type-trap { background: #fef3c7; border-color: #f59e0b; }
        .cell.type-trap .cell-title { color: #b45309; }
        .cell.type-goal { background: linear-gradient(135deg, #ff4d6d, #ff758f); border-color: #ff4d6d; }
        .cell.type-goal .cell-title, .cell.type-goal .cell-num { color: #ffffff; }

        /* ตัวหมากเบบี๋ */
        .player-token {
            position: absolute;
            top: -8px;
            right: -6px;
            width: 28px;
            height: 28px;
            background: #ff4d6d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.28);
            border: 2px solid #ffffff;
            z-index: 10;
            animation: bounceToken 0.8s infinite alternate;
        }

        @keyframes bounceToken {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-4px) scale(1.08); }
        }

        /* ส่วนควบคุมลูกเต๋า */
        .controls-area {
            background: #fff8f9;
            border: 1.5px dashed #ffb3c1;
            border-radius: 20px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 12px;
        }

        .dice-box {
            width: 64px;
            height: 64px;
            background: #ffffff;
            border: 2.5px solid #ff4d6d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ff4d6d;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.18);
            user-select: none;
        }
        .dice-rolling {
            animation: shakeDice 0.4s infinite;
        }
        @keyframes shakeDice {
            0% { transform: rotate(0deg) scale(1.05); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(-15deg) scale(1.05); }
            75% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .btn-roll {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.96rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 77, 109, 0.3);
            transition: all 0.2s;
            flex: 1;
            max-width: 240px;
        }
        .btn-roll:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-roll:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* ปุ่มเสริมด้านล่าง */
        .bottom-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }
        .btn-text {
            background: none;
            border: none;
            color: #888;
            font-family: 'Prompt', sans-serif;
            font-size: 0.78rem;
            text-decoration: underline;
            cursor: pointer;
        }
        .btn-text:hover { color: #ff4d6d; }
        .btn-surrender {
            color: #f59e0b;
            font-weight: 600;
        }

        /* ป๊อปอัปคำสั่งเมื่อตกช่อง */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: popModal 0.35s ease forwards;
            border: 3px solid #ff8fa3;
        }
        @keyframes popModal {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .badge-cute { background: #ffe0e6; color: #ff4d6d; }
        .badge-hot { background: #d90429; color: #ffffff; }
        .badge-trap { background: #fef3c7; color: #b45309; }

        .modal-icon { font-size: 3.2rem; margin-bottom: 8px; }
        .modal-title {
            font-family: 'Mali', cursive;
            font-size: 1.35rem;
            color: #ff4d6d;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.55;
            margin-bottom: 18px;
            background: #fff8f9;
            padding: 12px;
            border-radius: 14px;
            border: 1px dashed #ffb3c1;
            white-space: pre-line;
        }

        /* ตัวจับเวลาในป๊อปอัป */
        .timer-box {
            display: none;
            margin-bottom: 16px;
        }
        .timer-display {
            font-family: 'Mali', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            color: #d90429;
            margin-bottom: 6px;
        }
        .btn-timer {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .btn-done {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>บอร์ดเกมทอยเต๋าของเบบี๋ 🎲💕</h2>
        <div class="badges-row">
            <div class="status-badge" id="pos-badge">ช่องที่ 1 (จุดเริ่มต้น)</div>
        </div>

        <!-- กระดาน 20 ช่อง -->
        <div class="board-grid" id="board"></div>

        <!-- โซนทอยลูกเต๋า -->
        <div class="controls-area">
            <div class="dice-box" id="dice-display">🎲</div>
            <button class="btn-roll" id="roll-btn" onclick="rollDice()">ทอยลูกเต๋าเลยเบบี๋! ✨</button>
        </div>

        <div class="bottom-actions">
            <button class="btn-text" onclick="resetGame()">เริ่มใหม่ตั้งแต่ช่อง 1 🔄</button>
            <button class="btn-text btn-surrender" id="surrender-btn" onclick="surrenderToGoal()">ยอมแพ้ / ข้ามไปเส้นชัยเลย 🏳️</button>
        </div>
    </div>

    <!-- ป๊อปอัปแสดงคำสั่ง -->
    <div class="modal" id="action-modal">
        <div class="modal-card">
            <div class="modal-badge" id="m-badge">คำสั่ง</div>
            <div class="modal-icon" id="m-icon">🔥</div>
            <div class="modal-title" id="m-title">ชื่อช่อง</div>
            <div class="modal-desc" id="m-desc">รายละเอียดคำสั่ง</div>

            <div class="timer-box" id="m-timer-box">
                <div class="timer-display" id="m-timer-text">00:30</div>
                <button class="btn-timer" id="m-timer-btn" onclick="startCountdown()">เริ่มจับเวลา ⏱️</button>
            </div>

            <button class="btn-done" onclick="closeModal()">ทำเสร็จแล้ว / ไปต่อเลย ✔️</button>
        </div>
    </div>

    <script>
        // ข้อมูลทั้ง 20 ช่อง (น่ารัก + กับดัก + 20+ น้องสาวน้องชาย)
        const boardSpaces = [
            { id: 1, type: 'cute', icon: '🏁', title: 'จุดเริ่มต้น', desc: 'กอดกันแน่นๆ 1 ทีเพื่อเอาฤกษ์เอาชัยก่อนเริ่มทอย 💕', time: 0 },
            { id: 2, type: 'cute', icon: '💋', title: 'จุ้บแก้ม', desc: 'จุ้บแก้มเค้าซ้าย-ขวา ข้างละ 5 ทีแบบเสียงดังๆ 😘', time: 0 },
            { id: 3, type: 'hot', icon: '🫦', title: 'ถอด 1 ชิ้น', desc: 'ไม่ว่าจะใส่อะไรอยู่ เบบี๋ต้องถอดออก 1 ชิ้นทันที ห้ามโกง! 🔥', time: 0 },
            { id: 4, type: 'hot', icon: '👅', title: 'ทักทายน้องชาย/น้องสาว', desc: 'ใช้มือลูบไล้เบาๆ ผ่านร่มผ้าตรงน้องชายหรือน้องสาว 30 วินาที 🙈', time: 30 },
            { id: 5, type: 'trap', icon: '⏪', title: 'ถอยหลัง 2 ช่อง!', desc: 'ดวงกุด! เดินถอยหลังกลับไป 2 ช่อง และโดนเค้าตีก้นเบาๆ 3 ที 😜', move: -2, time: 0 },
            { id: 6, type: 'cute', icon: '💆', title: 'นวดเอาใจ', desc: 'นวดไหล่หรือนวดหลังให้เค้า 1 นาที พร้อมพูดชมว่าน่ารักที่สุด 🥰', time: 60 },
            { id: 7, type: 'hot', icon: '👄', title: 'แลกลิ้นดูดดื่ม', desc: 'จูบแลกลิ้นกันแบบเน้นๆ ห้ามถอนปากออกจนกว่าจะครบ 45 วินาที 💋', time: 45 },
            { id: 8, type: 'hot', icon: '🔥', title: 'จูบน้องชาย/น้องสาว', desc: 'ก้มลงไปจูบหรือใช้ลิ้นทักทายน้องชายหรือน้องสาว 30 วินาทีเต็ม 😈', time: 30 },
            { id: 9, type: 'trap', icon: '🙈', title: 'โดนปิดตา!', desc: 'เบบี๋ต้องหาผ้ามาปิดตาไว้จนกว่าจะทอยลูกเต๋ารอบหน้า ห้ามแอบดูเด็ดขาด!', time: 0 },
            { id: 10, type: 'cute', icon: '👂', title: 'กระซิบข้างหู', desc: 'กระซิบข้างหูเค้าเบาๆ ว่าคืนนี้อยากทำอะไรกับน้องชาย/น้องสาวมากที่สุด 🫣', time: 0 },
            { id: 11, type: 'hot', icon: '💦', title: 'อ๊อก / เลียจัดเต็ม', desc: 'จัดให้เต็มที่! ใช้ปากปรนน้องชายหรือน้องสาว 1 นาทีเต็ม ห้ามหยุด 👅💦', time: 60 },
            { id: 12, type: 'trap', icon: '⏩', title: 'ทางลัดเร่าร้อน!', desc: 'เดินข้ามไปข้างหน้า 2 ช่องทันที แต่ต้องถอดเสื้อผ้าออกอีก 1 ชิ้นเป็นค่าผ่านทาง! 🫦', move: 2, time: 0 },
            { id: 13, type: 'hot', icon: '🤲', title: 'ใช้มือช่วยเร่งเครื่อง', desc: 'ใช้มือชักหรือบิ้วท์น้องชาย/น้องสาวให้เสียวซ่าน 45 วินาที 🔥', time: 45 },
            { id: 14, type: 'cute', icon: '💋', title: 'ดูดซอกคอ', desc: 'ซุกไซร้และดูดที่ซอกคอเบาๆ 30 วินาที ห้ามส่งเสียงครางออกมา! 🤫', time: 30 },
            { id: 15, type: 'hot', icon: '🍑', title: 'สัมผัสตรงๆ', desc: 'ถอดชิ้นล่างออกให้หมด แล้วลูบคลำน้องชาย/น้องสาวแบบเนื้อแนบเนื้อ 1 นาที 😈', time: 60 },
            { id: 16, type: 'trap', icon: '⏪', title: 'กับดักถอยหลัง!', desc: 'เดินถอยหลัง 3 ช่อง! และต้องยอมให้แกล้งเขี่ยหรือบีบน้องชาย/น้องสาว 15 วินาที 😝', move: -3, time: 15 },
            { id: 17, type: 'hot', icon: '🛏️', title: 'ลองท่าใหม่', desc: 'ขึ้นคร่อมหรือจัดท่าเตรียมพร้อมแบบ 20+ ให้น้องชายกับน้องสาวสัมผัสกันภายนอก 45 วินาที 🔥', time: 45 },
            { id: 18, type: 'cute', icon: '💖', title: 'พักหายใจ & กอดจูบ', desc: 'พักเหนื่อยแป๊บนึง นอนกอดกันแล้วจูบหน้าผาก จูบจมูก จูบปาก อย่างละ 3 ที 🥰', time: 0 },
            { id: 19, type: 'hot', icon: '💥', title: 'โค้งสุดท้ายจัดหนัก!', desc: 'เค้าสั่งให้เบบี๋ทำอะไรกับน้องชาย/น้องสาวก็ได้ 1 อย่าง ห้ามปฏิเสธเด็ดขาด! 😈', time: 0 },
            { id: 20, type: 'goal', icon: '👑', title: 'เส้นชัย! ยอมทุกอย่าง', desc: 'เดินถึงเส้นชัยแล้ว! คืนนี้เบบี๋ได้สิทธิ์คุมเกมทั้งหมด จะให้ทำท่าไหน กี่ยก เค้ายอมตามใจทุกอย่างเลย! 🎉🔥', time: 0 }
        ];

        let playerPos = 1;
        let isRolling = false;
        let pendingMove = 0;
        let timerInterval = null;
        let timeLeft = 0;

        // สร้างกระดาน
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            boardSpaces.forEach(space => {
                const isHere = playerPos === space.id;
                const cell = document.createElement('div');
                cell.className = `cell type-${space.type}` + (isHere ? ' active-cell' : '');
                cell.id = `cell-${space.id}`;

                const tokenHTML = isHere ? '<div class="player-token" title="เบบี๋อยู่ตรงนี้">💖</div>' : '';

                cell.innerHTML = `
                    <span class="cell-num">${space.id}</span>
                    ${tokenHTML}
                    <div class="cell-icon">${space.icon}</div>
                    <div class="cell-title">${space.title}</div>
                `;
                boardEl.appendChild(cell);
            });

            const currentSpace = boardSpaces.find(s => s.id === playerPos);
            document.getElementById('pos-badge').innerText = `ช่องที่ ${playerPos} / 20 : ${currentSpace.title}`;
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('roll-btn').disabled = true;

            const diceEl = document.getElementById('dice-display');
            diceEl.classList.add('dice-rolling');

            const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            let rollCount = 0;

            const animInterval = setInterval(() => {
                diceEl.innerText = diceFaces[Math.floor(Math.random() * 6)];
                rollCount++;
                if (rollCount > 10) {
                    clearInterval(animInterval);
                    diceEl.classList.remove('dice-rolling');
                    const finalRoll = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = diceFaces[finalRoll - 1];
                    movePlayer(finalRoll);
                }
            }, 60);
        }

        // เดินทีละก้าว ถ้าเกิน 20 ให้เด้งถอยหลังกลับ
        function movePlayer(steps) {
            let stepCount = 0;
            let direction = 1; // 1 = เดินหน้า, -1 = เด้งถอยหลัง
            let bounced = false;

            const stepInterval = setInterval(() => {
                if (direction === 1 && playerPos === 20) {
                    direction = -1; // ชนเส้นชัยแล้วแต้มเหลือ ให้เด้งถอยหลัง
                    bounced = true;
                }

                playerPos += direction;
                renderBoard();
                stepCount++;

                if (stepCount >= steps) {
                    clearInterval(stepInterval);
                    setTimeout(() => {
                        triggerSpaceEvent(playerPos, bounced, false);
                    }, 300);
                }
            }, 250);
        }

        function surrenderToGoal() {
            if (isRolling || playerPos === 20) return;
            playerPos = 20;
            renderBoard();
            triggerSpaceEvent(20, false, true);
        }

        function triggerSpaceEvent(pos, bounced = false, isSurrender = false) {
            const space = boardSpaces.find(s => s.id === pos);
            pendingMove = space.move || 0;

            const badge = document.getElementById('m-badge');
            if (space.type === 'cute') {
                badge.innerText = 'ช่องน่ารัก 💕';
                badge.className = 'modal-badge badge-cute';
            } else if (space.type === 'hot') {
                badge.innerText = 'ช่อง 20+ เร่าร้อน 🔥';
                badge.className = 'modal-badge badge-hot';
            } else if (space.type === 'trap') {
                badge.innerText = 'ช่องพิเศษ / กับดัก ⚡';
                badge.className = 'modal-badge badge-trap';
            } else {
                badge.innerText = isSurrender ? 'ยอมแพ้แล้ว! 🏳️👑' : 'เข้าเส้นชัยสำเร็จ! 👑';
                badge.className = 'modal-badge badge-hot';
            }

            document.getElementById('m-icon').innerText = space.icon;
            document.getElementById('m-title').innerText = `ช่องที่ ${space.id}: ${space.title}`;
            
            let descText = space.desc;
            if (bounced) {
                descText = `อุ๊ย! ทอยเกินช่อง 20 เลยเด้งถอยหลังกลับมาตกช่องนี้แทน 😜\n\n${descText}`;
            } else if (isSurrender) {
                descText = `แบร่! กดยอมแพ้ข้ามมาเส้นชัยเลยเหรอ งั้นถือว่าเค้าเป็นคนคุมเกมแทนนะ คืนนี้เบบี๋ต้องตามใจเค้าทุกอย่าง! 😈🔥`;
            }
            document.getElementById('m-desc').innerText = descText;

            // ตั้งค่าตัวจับเวลาถ้าช่องนั้นระบุเวลาไว้
            clearInterval(timerInterval);
            const timerBox = document.getElementById('m-timer-box');
            if (space.time > 0) {
                timeLeft = space.time;
                timerBox.style.display = 'block';
                document.getElementById('m-timer-text').innerText = formatTime(timeLeft);
                document.getElementById('m-timer-btn').disabled = false;
                document.getElementById('m-timer-btn').innerText = 'เริ่มจับเวลา ⏱️';
            } else {
                timerBox.style.display = 'none';
            }

            document.getElementById('action-modal').style.display = 'flex';
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startCountdown() {
            const btn = document.getElementById('m-timer-btn');
            btn.disabled = true;
            btn.innerText = 'กำลังนับถอยหลัง...';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('m-timer-text').innerText = formatTime(timeLeft);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('m-timer-text').innerText = 'หมดเวลา! 🎉';
                    btn.innerText = 'ครบเวลาแล้ว ✔️';
                }
            }, 1000);
        }

        function closeModal() {
            clearInterval(timerInterval);
            document.getElementById('action-modal').style.display = 'none';

            // เช็คว่ามีคำสั่งเดินหน้า/ถอยหลังค้างอยู่ไหม
            if (pendingMove !== 0) {
                playerPos = Math.max(1, Math.min(20, playerPos + pendingMove));
                pendingMove = 0;
                renderBoard();
            }

            const rollBtn = document.getElementById('roll-btn');

            // เช็คว่าเข้าเส้นชัยช่อง 20 แบบพอดีเป๊ะหรือยัง
            if (playerPos === 20) {
                isRolling = false;
                rollBtn.disabled = true;
                rollBtn.innerText = 'จบเกมแล้ว! ถึงเส้นชัย 👑';
                document.getElementById('surrender-btn').style.display = 'none';
                return;
            }

            isRolling = false;
            rollBtn.disabled = false;
        }

        function resetGame() {
            playerPos = 1;
            isRolling = false;
            pendingMove = 0;
            clearInterval(timerInterval);
            document.getElementById('dice-display').innerText = '🎲';
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.innerText = 'ทอยลูกเต๋าเลยเบบี๋! ✨';
            rollBtn.disabled = false;
            document.getElementById('surrender-btn').style.display = 'inline-block';
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
